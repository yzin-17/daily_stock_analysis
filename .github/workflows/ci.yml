name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 数据输入变更检测
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      docker: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
      - name: 检测数据运行、门禁和镜像输入
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '.dockerignore'
              - 'server.py'
              - 'api/**'
              - 'data_provider/**'
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'docker/**'
              - 'requirements.txt'
              - 'setup.cfg'
              - '.env.example'
              - '.github/**'
              - 'docs/evidence/2026-10-19-data-service-inventory.jsonl'
            docker:
              - 'server.py'
              - 'api/**'
              - 'data_provider/**'
              - 'src/**'
              - 'docker/**'
              - 'requirements.txt'
              - '.dockerignore'
              - 'patches/longbridge-sdk/**'
              - 'scripts/data-runtime-contract.json'
              - 'scripts/build_thesis_ledger_longbridge_sdk.py'
              - 'scripts/sdk-source.json'
              - 'scripts/verify_longbridge_native_storage.py'
              - 'scripts/admit_nav_research.py'
              - '.github/workflows/ci.yml'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 核对仓库协作规则
        run: python scripts/check_ai_assets.py

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r .github/requirements-ci.txt; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - uses: actions/setup-node@v4
        if: matrix.shard == 1
        with:
          node-version: 24
      - name: 验证本地数据工具与构建命令
        if: matrix.shard == 1
        run: |
          git clone --depth 1 https://github.com/yzin-17/thesis-ledger-infra.git ../thesis-ledger-infra
          git clone --depth 1 https://github.com/yzin-17/thesis-ledger.git ../thesis-ledger
          node --test scripts/local-runtime/*.test.mjs scripts/deployment/*.test.mjs scripts/prepare-local-sdk-source.test.mjs
          for test_file in scripts/local-runtime/*.test.py; do PYTHONPATH="$PWD" python -B "$test_file"; done
          for test_file in scripts/deployment/*.test.py; do python -B "$test_file"; done
      - name: 核对全局数据 SDK
        if: matrix.shard == 1
        run: python -c "import futu; print('Futu 数据 SDK 可导入')"
      - name: 数据语法与闭包
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: 关键静态检查
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: 数据合同与收集范围
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/3
        env:
          PYTEST_SPLITS: '3'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
          ENV_FILE: ${{ runner.temp }}/dsa-data-${{ matrix.shard }}.env
          STOCK_INDEX_REMOTE_UPDATE_ENABLED: 'false'
        run: |
          : > "$ENV_FILE"
          ./scripts/ci_gate.sh offline-tests

  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance, backend-tests]
    if: always()
    steps:
      - name: 汇总数据门禁
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$AI_GOVERNANCE_RESULT" != "success" ]; then
            echo "前置检查失败" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$BACKEND_TESTS_RESULT" != "success" ]; then
            echo "数据测试分片未全部通过" >&2
            exit 1
          fi
          echo "数据门禁通过"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 核对打包合同
        run: python scripts/check_data_runtime_contract.py
      - uses: docker/setup-buildx-action@v3
      - name: 构建数据镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 验证隔离数据镜像
        run: bash scripts/verify_data_image.sh stock-analysis:test
