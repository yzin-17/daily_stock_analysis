name: Temporary Backtest V2 Closure

on:
  push:
    branches:
      - fix/backtest-v2-closure-20260911

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/backtest-v2-closure-20260911
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Sync existing contract tests and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_thesis_ledger_v2_dependencies.py')
          text = test_path.read_text(encoding='utf-8')
          old_import = 'from src.services.thesis_ledger_v2_dependencies import calendar_fact\n'
          new_import = (
              'from src.services import thesis_ledger_v2_dependencies as v2_dependencies\n'
              'from src.services.thesis_ledger_v2_dependencies import calendar_fact\n'
          )
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('dependency test import anchor not found')
              text = text.replace(old_import, new_import, 1)
          anchor = 'def test_v2_rejects_etf_and_never_leaks_fixture_facts(monkeypatch):\n    client = _client(monkeypatch, fixture=False)\n'
          replacement = '''def test_v2_rejects_etf_and_never_leaks_fixture_facts(monkeypatch):
    monkeypatch.setattr(
        v2_dependencies,
        "real_cn_tradability",
        lambda *_args, **_kwargs: {
            "provider": "baostock",
            "providerRevision": "baostock-test",
            "coverage": {"start": "2025-01-01", "end": "2025-01-10", "complete": False},
            "tradable": False,
            "suspendedDates": [],
            "ipoDate": "2001-08-27",
            "outDate": None,
            "availableAt": "2025-01-10T16:00:00+00:00",
            "reason": "Provider 未提供历史状态",
        },
    )
    client = _client(monkeypatch, fixture=False)
'''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('dependency test function anchor not found')
              text = text.replace(anchor, replacement, 1)
          old_revision = 'assert instrument.json()["providerRevision"] == "cn-a-share-standard-lot-tick-v1"'
          new_revision = 'assert instrument.json()["providerRevision"] == "baostock-test+cn-a-share-standard-lot-tick-v1"'
          if new_revision not in text:
              if old_revision not in text:
                  raise SystemExit('provider revision assertion anchor not found')
              text = text.replace(old_revision, new_revision, 1)
          test_path.write_text(text, encoding='utf-8')

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '- [改进] ThesisLedger V2 instrument-facts 要求显式传入事实 start/end 与 executionStart/executionEnd；静态 lot/tick 保留原始规则 unavailable，并返回历史可交易性缺失的字段、区间与 Provider 原因。旧版无区间请求返回 422，消费端须同步升级；尚未提供历史状态 Provider。\n'
          new = (
              '- [修复] ThesisLedger V2 instrument-facts 复用 BaoStock 的证券基础信息、交易日历与 `tradestatus` 核验 CN 股票历史上市/退市/停牌状态；缺失 Provider 行只会使覆盖不完整，不再被猜测为停牌。历史状态完整且区间内可交易时允许由已冻结研究模型补足独立的 executionRules 假设；已知停牌或覆盖缺失仍保持 critical fact 失败。\n'
              '- [改进] ThesisLedger V2 instrument-facts 要求显式传入事实 start/end 与 executionStart/executionEnd；静态 lot/tick 保留原始规则 unavailable，并返回历史可交易性缺失的字段、区间与 Provider 原因。旧版无区间请求返回 422，消费端须同步升级。\n'
          )
          if new not in text:
              if old not in text:
                  raise SystemExit('changelog anchor not found')
              text = text.replace(old, new, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
      - name: Focused backend validation
        run: |
          python -m py_compile src/services/thesis_ledger_v2_dependencies.py src/services/thesis_ledger_v2_tradability.py tests/test_thesis_ledger_v2_dependencies.py tests/test_thesis_ledger_v2_tradability.py
          python -m flake8 src/services/thesis_ledger_v2_dependencies.py src/services/thesis_ledger_v2_tradability.py tests/test_thesis_ledger_v2_dependencies.py tests/test_thesis_ledger_v2_tradability.py --select=E9,F63,F7,F82
          python -m pytest tests/test_thesis_ledger_v2_dependencies.py tests/test_thesis_ledger_v2_tradability.py -q --tb=short --disable-warnings
          git diff --check
      - name: Commit synced tests and changelog
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_thesis_ledger_v2_dependencies.py docs/CHANGELOG.md
          git commit -m "test: align historical tradability contract"
          git push origin HEAD:fix/backtest-v2-closure-20260911
